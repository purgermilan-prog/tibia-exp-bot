name: Tibia Weekly EXP Report

on:
  workflow_dispatch:

  schedule:
    # Every Monday at 10:45 CEST / 08:45 UTC
    - cron: "45 8 * * 1"

permissions:
  contents: read

jobs:
  weekly-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run weekly report
        env:
          DISCORD_WEEKLY: ${{ secrets.DISCORD_WEEKLY }}
        run: python weekly_report.py
