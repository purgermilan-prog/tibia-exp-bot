name: Guild EXP Report

on:
  schedule:
    - cron: "0 22 * * *"   # codziennie o 22:00
  workflow_dispatch:

jobs:
  guild-exp:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run guild report
        run: python guild_exp.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Save guild EXP history
        run: |
          git config --global user.name "tibia-exp-bot"
          git config --global user.email "tibia-exp-bot@users.noreply.github.com"

          git add guild_exp_history.json

          git commit -m "Update guild EXP history" || exit 0

          git push
